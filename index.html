<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Calculator</title>
    <link rel="stylesheet", href="style.css">
    <script src="code.js" defer></script>
</head>
<body>
    <div class="header", id="header">
    <h1> Javascript Addition Calculator </h1>
    <h3><i>(you can either inspect element the console or use the one at the bottom)</i></h3>
    </div>
    <div class="body", id="body">
    <h2>Operation Type</h2>
    <table border=3>
        <tr>
            <th><button id="+">+</button></th>
            <th><button id="-">-</button></th>
            <th><button id="*">*</button></th>
            <th><button id="/">/</button></th>
        </tr>
    </table>
    </div>
    <div class="body", id="bodyy">
    <h2>Number Pad</h2>
    <table border=3>
        <tr>
            <th><button id="1", class="button">1</button></th>
            <th><button id="2", class="button">2</button></th>
            <th><button id="3", class="button">3</button></th>
        </tr>
        <tr>
            <th><button id="4", class="button">4</button></th>
            <th><button id="5", class="button">5</button></th>
            <th><button id="6", class="button">6</button></th>
        </tr>
        <tr>
            <th><button id="7", class="button">7</button></th>
            <th><button id="8", class="button">8</button></th>
            <th><button id="9", class="button">9</button></th>
        </tr>
        <tr>
            <th></th>
            <th><button id="0", class="button">0</button></th>
            <th></th>
        </tr>
    </table>
    </div>
    <div class="console", id="html-console">
    </div>
    <button id="mode", class="button">Toggle light and dark mode</button>
</body>
</html>
